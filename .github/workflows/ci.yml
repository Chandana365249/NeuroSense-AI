# Continuous integration for NeuroSense AI.
#
# - Uses only synthetic DEAP-format fixtures generated by the tests and temporary SQLite databases.
# - Never needs or downloads the licensed DEAP dataset, never contacts a real PostgreSQL server, and uploads no
#   artifacts (no datasets, models, databases or logs leave the runner).
# - Real-dataset integration tests (marker "integration") are deliberately NOT run here; the job says so explicitly.
# - No deployment steps.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  NEUROSENSE_ENVIRONMENT: test

jobs:
  backend:
    name: Backend tests (synthetic data, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate a throwaway JWT secret for this run
        # Random per run; never stored. Tests construct their own settings; this is for alembic below.
        run: echo "NEUROSENSE_JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Check database migrations against a temporary SQLite database
        env:
          NEUROSENSE_DATABASE_URL: sqlite:///${{ runner.temp }}/migration_check.sqlite3
        run: |
          alembic upgrade head
          alembic check
      - name: Run backend tests
        # -rs lists every skipped test with its reason. The deep-learning (torch) tests are skipped here and run in
        # the separate backend-deep-learning job.
        run: python -m pytest -q -rs
      - name: Real-dataset tests are not run in CI
        run: |
          echo "::notice title=Integration tests not run::Tests marked 'integration' need the licensed DEAP dataset and are deselected in CI (pytest.ini: -m 'not integration'). Run them locally: python -m pytest -m integration"

  backend-deep-learning:
    name: Deep-learning tests (CPU torch, synthetic data)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dl.txt
      - name: Install dependencies (CPU-only torch)
        run: python -m pip install -r requirements-dl.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run CNN and robust-evaluation tests
        run: python -m pytest -q -rs tests/test_deep.py tests/test_robust_evaluation.py

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
